services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: skilllens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skilllens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilllens}
      POSTGRES_DB: skilllens
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilllens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (caching layer) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skilllens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── ML Pipeline runner (one-shot) ────────────────────────────────────────
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilllens_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://skilllens:skilllens@postgres:5432/skilllens
    volumes:
      - ./backend/data:/app/data
    command: >
      sh -c "
        python pipelines/build_clusters.py &&
        python pipelines/build_forecasts.py &&
        python pipelines/build_ses.py &&
        python pipelines/build_industry_analytics.py &&
        python pipelines/build_knowledge_base.py &&
        python pipelines/validate_data.py &&
        python pipelines/build_skill_master.py
      "
    profiles: ["pipeline"]  # run with: docker compose --profile pipeline up pipeline

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilllens_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://skilllens:skilllens@postgres:5432/skilllens
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-development}
      CORS_ORIGINS: '["http://localhost:5173","https://skilllens.vercel.app"]'
      DEBUG: "false"
    volumes:
      - ./backend/data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: skilllens_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
